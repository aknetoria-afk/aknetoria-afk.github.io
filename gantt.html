<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>План проекта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F0F2F4;
    --panel: #FFFFFF;
    --panel-alt: #F7F8FA;
    --ink: #1B222B;
    --ink-soft: #5B6572;
    --ink-faint: #99A3AD;
    --border: #DADFE4;
    --border-soft: #E7EAED;
    --accent: #2F6FCC;
    --accent-strong: #23579E;
    --accent-tint: rgba(47,111,204,.1);
    --accent-on: #FFFFFF;
    --weekend: rgba(47,111,204,.06);
    --holiday: rgba(194,78,48,.10);
    --today: #C24E30;
    --dep-line: #8A93A0;
    --done: #1F8A54;
    --danger: #C24E30;
    --focus-ring: #2F6FCC;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151C; --panel: #171E27; --panel-alt: #1C242F;
      --ink: #E8ECEF; --ink-soft: #9AA6B2; --ink-faint: #6B7684;
      --border: #2A333F; --border-soft: #232B36;
      --accent: #5B9BE8; --accent-strong: #7FB0EE; --accent-on: #0C1420; --accent-tint: rgba(91,155,232,.14);
      --weekend: rgba(91,155,232,.08); --holiday: rgba(224,122,84,.14); --today: #E07A54; --done: #4EA672; --danger: #E07A54; --dep-line: #6B7684;
      --focus-ring: #5B9BE8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10151C; --panel: #171E27; --panel-alt: #1C242F;
    --ink: #E8ECEF; --ink-soft: #9AA6B2; --ink-faint: #6B7684;
    --border: #2A333F; --border-soft: #232B36;
    --accent: #5B9BE8; --accent-strong: #7FB0EE; --accent-on: #0C1420; --accent-tint: rgba(91,155,232,.14);
    --weekend: rgba(91,155,232,.08); --holiday: rgba(224,122,84,.14); --today: #E07A54; --done: #4EA672; --danger: #E07A54; --dep-line: #6B7684;
    --focus-ring: #5B9BE8;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg);
    background-image:
      linear-gradient(var(--border-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea, select { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .hidden { display: none !important; }

  /* ---------- library ---------- */
  .libScreen { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 32px 40px 60px; max-width: 1180px; margin: 0 auto; width: 100%; box-sizing: border-box; }
  .libTopbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .libFilters { display: flex; gap: 10px; margin-bottom: 24px; }
  .libFilters input[type="text"] { flex: 1; max-width: 320px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; color: var(--ink); }
  .libFilters select { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; color: var(--ink); }
  .libGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .libCard {
    text-align: left; background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; cursor: pointer; display: flex; flex-direction: column; gap: 10px;
    transition: border-color .15s ease, transform .1s ease;
  }
  .libCard:hover, .libCard:focus-visible { border-color: var(--accent); transform: translateY(-1px); }
  .libCard-topic { display: inline-flex; align-self: flex-start; font-size: 11px; font-weight: 600; color: var(--accent-strong); background: var(--accent-tint, rgba(47,111,204,.1)); padding: 3px 9px; border-radius: 999px; }
  .libCard h2 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; color: var(--ink); line-height: 1.3; }
  .libCard p { margin: 0; font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; min-height: 1.5em; }
  .libCard-meta { display: flex; gap: 12px; font-size: 11.5px; color: var(--ink-faint); }
  .libCard-bar { height: 5px; border-radius: 3px; background: var(--border-soft); overflow: hidden; }
  .libCard-bar i { display: block; height: 100%; background: var(--done); }
  .libCard-foot { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
  .libEmpty { color: var(--ink-faint); font-size: 13.5px; text-align: center; padding: 60px 0; }
  .btn-back { background: none; border: none; color: var(--ink-soft); font-size: 13px; cursor: pointer; padding: 0; margin-right: 2px; }
  .btn-back:hover { color: var(--accent-strong); }

  /* ---------- project header (editable title/description/topic) ---------- */
  .projectHeader { flex: 0 0 auto; background: var(--panel); border-bottom: 1px solid var(--border); padding: 16px 20px 14px; display: flex; gap: 14px; align-items: flex-start; }
  .projectHeaderMain { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .projTitleInput {
    border: none; background: none; width: 100%; font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 20px; color: var(--ink); padding: 3px 4px; margin: -3px -4px; border-radius: 4px;
  }
  .projTitleInput:hover, .projTitleInput:focus { background: var(--panel-alt); }
  .projDescInput {
    border: none; background: none; width: 100%; font-size: 13px; color: var(--ink-soft);
    padding: 2px 4px; margin: -2px -4px; border-radius: 4px;
  }
  .projDescInput:hover, .projDescInput:focus { background: var(--panel-alt); }
  .projTopicInput {
    border: none; background: none; max-width: 240px; font-size: 11.5px; color: var(--ink-faint);
    padding: 2px 4px; margin: -2px -4px -2px -4px; border-radius: 4px;
  }
  .projTopicInput:hover, .projTopicInput:focus { background: var(--panel-alt); color: var(--accent-strong); }
  .projTopicRow { display: flex; align-items: center; gap: 4px; margin-top: 1px; }
  .projTopicLabel { font-size: 11.5px; color: var(--ink-faint); }

  /* ---------- topbar ---------- */
  .topbar {
    flex: 0 0 auto;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { display:flex; align-items:baseline; gap:10px; margin-right:auto; }
  .brand h1 {
    font-family: 'Space Grotesk', sans-serif; font-weight:700; font-size:21px; margin:0; letter-spacing:-0.01em;
  }
  .brand .sub { color: var(--ink-faint); font-size: 12.5px; }
  .stat-inline { display:flex; gap:14px; font-size:12px; color:var(--ink-soft); margin-right:8px; }
  .stat-inline b { color: var(--ink); font-weight:600; }
  select.zoom {
    background: var(--panel-alt); border:1px solid var(--border); border-radius:6px;
    padding:8px 10px; font-size:13px;
  }
  .btn {
    border:1px solid var(--border); background: var(--panel-alt); color: var(--ink);
    border-radius:6px; padding:8px 13px; font-size:13px; font-weight:500; display:flex; align-items:center; gap:6px;
  }
  .btn:hover { border-color: var(--ink-faint); }
  .btn-primary { background: var(--accent); color: var(--accent-on); border:none; font-weight:600; }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn:disabled { opacity:.5; cursor:default; }

  .filtersRow {
    flex: 0 0 auto;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding: 10px 20px; border-bottom:1px solid var(--border); background: var(--bg);
  }
  .filtersRow input[type="text"], .filtersRow select {
    background: var(--panel); border:1px solid var(--border); border-radius:6px;
    padding:7px 10px; font-size:12.5px; color:var(--ink);
  }
  .filtersRow input[type="text"] { width:180px; }
  .chk { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); }

  .banner { flex:0 0 auto; padding:8px 20px; background: var(--panel-alt); border-bottom:1px solid var(--border); font-size:12.5px; color:var(--ink-soft); display:none; }

  /* ---------- gantt viewport ---------- */
  .ganttViewport { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }

  .topRow { position: sticky; top:0; z-index: 15; display:flex; background: var(--panel); border-bottom:1px solid var(--border); }
  .sidebarHeadCell { flex: 0 0 var(--sbw); width: var(--sbw); display:flex; border-right:1px solid var(--border); position:relative; }
  .sidebarHeadCell div { padding:8px 10px; font-size:11px; font-weight:600; color:var(--ink-faint); display:flex; align-items:center; }
  .col-title { width:var(--col-title-w); flex:0 0 var(--col-title-w); min-width:0; }
  .col-who { width:var(--col-who-w); flex:0 0 var(--col-who-w); padding:0 8px; }
  .col-days { width:var(--col-days-w); flex:0 0 var(--col-days-w); justify-content:flex-end; padding:0 10px 0 8px; }
  .colResizer { position:absolute; top:0; bottom:0; width:9px; cursor:col-resize; z-index:3; touch-action:none; }
  .colResizer::after { content:""; position:absolute; left:4px; top:9px; bottom:9px; width:1px; background:var(--border); }
  .colResizer:hover::after, .colResizer.active::after { background:var(--accent); width:2px; left:3.5px; }
  body.resizing-cols, body.resizing-cols * { cursor:col-resize !important; user-select:none !important; }
  .timelineHeadScroll { flex:1 1 auto; overflow:hidden; position:relative; }
  .timelineHeadInner { position:relative; height:54px; }
  .monthBand { position:absolute; top:0; height:22px; border-right:1px solid var(--border-soft); display:flex; align-items:center; padding-left:8px; font-size:12px; font-weight:600; font-family:'Space Grotesk',sans-serif; color:var(--ink-soft); white-space:nowrap; overflow:hidden; }
  .dayCell { position:absolute; top:22px; height:32px; border-right:1px solid var(--border-soft); display:flex; align-items:center; justify-content:center; font-size:10.5px; color:var(--ink-faint); }
  .dayCell.weekend { background: var(--weekend); }

  .mainRow { display:flex; align-items:flex-start; }
  .sidebar { flex: 0 0 var(--sbw); width: var(--sbw); border-right:1px solid var(--border); background: var(--panel); }
  .sidebarRows { position:relative; }
  .timelineBodyScroll { flex:1 1 auto; overflow-x:auto; overflow-y:hidden; position:relative; }
  .timelineBodyInner { position:relative; }
  .gridLayer, .rowsLayer { position:absolute; top:0; left:0; }
  .depsLayer { position:absolute; top:0; left:0; pointer-events:none; overflow:visible; z-index:6; }
  .depPath { fill:none; stroke:var(--dep-line); stroke-width:1.6; }
  .depPath.warn { stroke:var(--danger); stroke-width:1.8; }
  .depHit { fill:none; stroke:transparent; stroke-width:11; pointer-events:stroke; cursor:pointer; }
  .depHit:hover + .depPath { stroke:var(--danger); stroke-width:2.4; }
  .monthLine { position:absolute; top:0; border-left:1px solid var(--border-soft); }
  .weekendRect { position:absolute; top:0; background: var(--weekend); }
  .weekendRect.holiday { background: var(--holiday); }

  .sideRow, .groupSideRow { position:absolute; left:0; width:100%; display:flex; align-items:center; border-bottom:1px solid var(--border-soft); }
  .sideRow:hover { background: var(--panel-alt); }
  .sideRow .col-title { display:flex; flex-direction:column; gap:2px; min-width:0; cursor:pointer; padding:0 8px 0 10px; }
  .sideRow .t-title { font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sideRow .t-progress { height:3px; border-radius:2px; background: var(--border-soft); overflow:hidden; }
  .sideRow .t-progress i { display:block; height:100%; }
  .who-chip { display:flex; align-items:center; gap:5px; min-width:0; }
  .avatar { width:19px; height:19px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:#fff; }
  .who-name { font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .t-days { font-size:11px; color:var(--ink-faint); text-align:right; }

  .groupSideRow { padding:0 10px; gap:8px; background: var(--panel-alt); font-family:'Space Grotesk',sans-serif; }
  .groupDot { width:9px; height:9px; border-radius:2px; flex-shrink:0; }
  .groupSideRow input.gTitle { flex:1 1 auto; min-width:0; background:none; border:none; font-size:12.5px; font-weight:600; color:var(--ink); padding:2px 0; font-family:'Space Grotesk',sans-serif; }
  .groupSideRow .gCount { font-size:11px; color:var(--ink-faint); flex-shrink:0; }
  .groupActions { display:flex; gap:1px; flex-shrink:0; }
  .iconBtn { background:none; border:none; color:var(--ink-faint); width:20px; height:20px; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .iconBtn:hover { background:var(--border-soft); color:var(--ink); }


  .groupBar { position:absolute; pointer-events:none; display:flex; align-items:center; z-index:2; }
  .groupBar .gb-bg { position:absolute; left:0; right:0; top:0; bottom:0; opacity:.3; border-radius:3px; }
  .groupBar .gb-fill { position:absolute; left:0; top:0; bottom:0; border-radius:3px; max-width:100%; opacity:.9; }
  .groupBar .gb-tick { position:absolute; top:13px; width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent; border-top:6px solid; }
  .groupBar .gb-l { left:0; } .groupBar .gb-r { right:0; }
  .groupBar .gb-label { position:relative; z-index:1; font-size:11px; font-weight:700; color:var(--ink); padding:0 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .groupBar.outside-label .gb-label { position:absolute; left:100%; margin-left:8px; padding:0; overflow:visible; font-weight:600; color:var(--ink-soft); }
  .groupBand { position:absolute; left:0; width:100%; border-bottom:1px solid var(--border-soft); }

  .bar { position:absolute; border-radius:3px; cursor:grab; display:flex; align-items:center; overflow:visible; }
  .bar .fill-bg { position:absolute; inset:0; opacity:.28; border-radius:3px; overflow:hidden; }
  .bar .fill-progress { position:absolute; top:0; left:0; bottom:0; border-radius:3px; overflow:hidden; }
  .bar .bar-label { position:relative; z-index:1; font-size:11px; font-weight:600; color:#fff; padding:0 7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 1px rgba(0,0,0,.25); pointer-events:none; }
  .bar.outside-label .bar-label { color: var(--ink); text-shadow:none; position:absolute; left:100%; margin-left:6px; }
  .barHandle { position:absolute; top:0; bottom:0; width:8px; cursor:ew-resize; z-index:3; }
  .barHandle.bh-l { left:-2px; }
  .barHandle.bh-r { right:-2px; }
  .barHandle::after { content:""; position:absolute; top:25%; bottom:25%; left:3px; width:2px; border-radius:1px; background:rgba(255,255,255,.85); opacity:0; }
  .bar:hover .barHandle::after { opacity:1; }
  .bar.outside-label .barHandle::after { background: var(--ink-faint); }
  .milestone { position:absolute; width:15px; height:15px; transform:rotate(45deg); cursor:grab; }
  .milestoneLabel { position:absolute; font-size:11px; font-weight:600; color:var(--ink); white-space:nowrap; pointer-events:none; }
  .linkHandle { position:absolute; top:50%; right:-6px; width:11px; height:11px; margin-top:-5.5px; border-radius:50%; background:var(--panel); border:2px solid var(--accent); cursor:crosshair; z-index:5; opacity:0; transition:opacity .12s, transform .12s; }
  .bar:hover .linkHandle { opacity:1; }
  .linkHandle:hover { transform:scale(1.25); }
  .ghostLinkPath { fill:none; stroke:var(--accent); stroke-width:1.6; stroke-dasharray:4 3; }
  .dropTargetHighlight { outline:2px solid var(--accent); outline-offset:1px; }
  body.dragging-bar, body.dragging-bar * { user-select:none !important; }
  body.dragging-bar .bar, body.dragging-bar .milestone { cursor:grabbing !important; }
  body.linking-deps, body.linking-deps * { user-select:none !important; cursor:crosshair !important; }

  .addStageFooter { padding:9px 14px; }
  .addStageFooter button { border:1px dashed var(--border); background:none; color:var(--ink-soft); border-radius:6px; padding:7px 12px; font-size:12.5px; width: 100%; box-sizing:border-box; }
  .addStageFooter button:hover { border-color: var(--accent); color: var(--accent-strong); }

  /* ---------- modal ---------- */
  .overlay { position:fixed; inset:0; background:rgba(10,14,18,.45); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px; }
  .modal { background: var(--panel); border-radius:8px; border:1px solid var(--border); width:100%; max-width:460px; max-height:88vh; overflow-y:auto; overflow-x:hidden; padding:22px; }
  .modal h2 { font-family:'Space Grotesk',sans-serif; font-size:17px; margin:0 0 16px; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:500; }
  .field input[type="text"], .field input[type="date"], .field input[type="number"], .field select, .field textarea {
    width:100%; background: var(--panel-alt); border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:13.5px; color:var(--ink);
  }
  .row2 { display:flex; gap:10px; }
  .row2 .field { flex:1 1 0; min-width:0; }
  .assigneeRow { display:flex; gap:8px; }
  .assigneeRow select { flex:1; }
  .swatches { display:flex; gap:7px; margin-top:8px; }
  .swatch { width:20px; height:20px; border-radius:50%; border:2px solid transparent; }
  .swatch.active { border-color: var(--ink); }
  .rangeRow { display:flex; align-items:center; gap:10px; }
  .rangeRow input[type="range"] { flex:1; }
  .rangeVal { font-size:12.5px; color:var(--ink-soft); width:38px; text-align:right; }
  .checkline { display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-soft); }
  .modal-actions { display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px; }
  .right-actions { display:flex; gap:8px; }
  .btn-ghost { background:none; border:1px solid var(--border); border-radius:6px; padding:8px 13px; font-size:13px; color:var(--ink-soft); }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { background: rgba(194,78,48,.08); }

  .teamList, .stageList { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; max-height:220px; overflow-y:auto; }
  .teamRow { display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--border-soft); border-radius:6px; }
  .teamRow input[type="text"] { flex:1; border:none; background:none; font-size:13px; padding:2px 0; }
  .addRow { display:flex; gap:8px; }
  .addRow input[type="text"] { flex:1; }


  .shareBox { display:flex; gap:8px; margin:10px 0 6px; }
  .shareBox input { flex:1; min-width:0; background:var(--panel-alt); border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:12.5px; color:var(--ink); }
  .shareNote { font-size:12px; color:var(--ink-soft); line-height:1.55; margin:0 0 8px; }
  .shareErr { font-size:12px; line-height:1.5; color:var(--danger); background:rgba(194,78,48,.08); border-radius:6px; padding:8px 10px; margin:12px 0 0; }
  .shareState { font-size:11.5px; color:var(--ink-faint); margin:6px 0 0; }

  /* print / export overlay */
  .printOverlay { position:fixed; inset:0; background: var(--bg); z-index:5000; display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px; }
  .printOverlay.show { display:flex; }
  .spinner { width:28px; height:28px; border-radius:50%; border:3px solid var(--border); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 720px) {
    .stat-inline { display:none; }
    .filtersRow input[type="text"] { width:130px; }
  }
</style>
</head>
<body style="--col-title-w:150px; --col-who-w:110px; --col-days-w:80px; --sbw:calc(var(--col-title-w) + var(--col-who-w) + var(--col-days-w));">

<!-- ========== LIBRARY VIEW ========== -->
<div class="libScreen" id="viewLibrary">
  <div class="libTopbar">
    <div class="brand">
      <h1>Библиотека дорожных карт</h1>
      <span class="sub">все проекты — ищите по названию или теме</span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn-ghost" id="btnChangePw" type="button">Сменить пароль</button>
      <button class="btn-ghost" id="btnImport" type="button">Импорт карт</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
      <button class="btn btn-primary" id="btnNewProject">+ Новый проект</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var SWATCHES = ["#2F6FCC", "#1F8A54", "#8A5FBF", "#C24E30", "#B8752B", "#0F9AA6", "#C2477F"];
  var RH = 40, GH = 34;
  var ZOOM_WIDTH = { day: 34, week: 14, month: 6 };

  var state = {
    view: "library", // "library" | "project"
    projectId: null,
    projects: [],    // catalog: [{id,name,description,topic,color,createdAt,taskCount,avgProgress,maxEnd}]
    libSearch: "",
    libTopic: "all",
    groups: [],
    team: [],
    tasks: [],
    holidays: [],
    zoom: "week",
    search: "",
    assigneeFilter: "all",
    hideDone: false,
    catalogLoaded: false,
    editingTask: null
  };

  // ---------- utils ----------
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function toDayNum(v) { var n = parseInt(v, 10); return isNaN(n) || n < 1 ? 1 : n; }
  // Virtual work-week: day 1 = "Monday". Positions 6 and 7 of every 7-day block are weekend.
  function isWeekendDay(dayNum) { var pos = ((dayNum - 1) % 7 + 7) % 7; return pos === 5 || pos === 6; }
  function isHolidayDay(dayNum) { return state.holidays.indexOf(dayNum) !== -1; }
  function isWorkingDay(dayNum) { return !isWeekendDay(dayNum) && !isHolidayDay(dayNum); }
  function workingDaysBetween(start, end) {
    var count = 0;
    for (var d = start; d <= end; d++) { if (isWorkingDay(d)) count++; }
    return count;
  }
  // find the end day so that exactly workDays working days fall within [start, end]
  function endDayForWorkingDays(start, workDays) {
    if (workDays <= 1) {
      var d0 = start, guard0 = 0;
      while (!isWorkingDay(d0) && guard0 < 3000) { d0++; guard0++; }
      return workDays <= 0 ? start : d0;
    }
    var count = 0, d = start, guard = 0;
    while (guard < 5000) {
      if (isWorkingDay(d)) { count++; if (count >= workDays) return d; }
      d++; guard++;
    }
    return d;
  }
  function initials(name) {
    var parts = (name || "").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }
  function contrastColor(hex) { return "#FFFFFF"; }

  function defaultGroups() { return [{ id: uid(), label: "Этап 1", color: SWATCHES[0] }]; }

  function computeProjectStats() {
    var total = state.tasks.length;
    var maxEnd = 0;
    var progressSum = 0;
    state.tasks.forEach(function (t) {
      var e = toDayNum(t.end || t.start || 1);
      if (e > maxEnd) maxEnd = e;
      progressSum += t.progress || 0;
    });
    return {
      taskCount: total,
      avgProgress: total ? Math.round(progressSum / total) : 0,
      maxEnd: maxEnd
    };
  }

  function showBanner(text) { document.getElementById("banner").style.display = "block"; document.getElementById("bannerText").textContent = text; }
  function hideBanner() { document.getElementById("banner").style.display = "none"; }
  function showToast(text, ms) {
    showBanner(text);
    setTimeout(function () {
      var el = document.getElementById("bannerText");
      if (el && el.textContent === text) hideBanner();
    }, ms || 3200);
  }
  // Native confirm()/prompt() are unreliable inside the artifact sandbox (they can resolve
  // instantly as cancelled without ever showing), so destructive/input actions use these instead.
  function showConfirm(message, onYes) {
    document.getElementById("modalRoot").innerHTML =
      '<div class="overlay" id="overlayConfirm"><div class="modal" style="max-width:360px;">' +
        '<h2 style="margin-bottom:10px;">Подтверждение</h2>' +
        '<p style="margin:0 0 18px;font-size:13.5px;color:var(--ink-soft);">' + escapeHtml(message) + "</p>" +
        '<div class="modal-actions"><span></span><div class="right-actions">' +
          '<button class="btn-ghost" id="btnConfirmNo">Отмена</button>' +
          '<button class="btn btn-primary" id="btnConfirmYes" style="background:var(--danger);border-color:var(--danger);">Удалить</button>' +
        "</div></div>" +
      "</div></div>";
    document.getElementById("overlayConfirm").addEventListener("mousedown", function (e) { if (e.target.id === "overlayConfirm") closeModal(); });
    document.getElementById("btnConfirmNo").addEventListener("click", closeModal);
    document.getElementById("btnConfirmYes").addEventListener("click", function () { closeModal(); onYes(); });
  }
  function showPrompt(title, placeholder, onSubmit) {
    document.getElementById("modalRoot").innerHTML =
      '<div class="overlay" id="overlayPrompt"><div class="modal" style="max-width:360px;">' +
        '<h2 style="margin-bottom:14px;">' + escapeHtml(title) + "</h2>" +
        '<div class="field"><input type="text" id="promptInput" placeholder="' + escapeHtml(placeholder || "") + '"></div>' +
        '<div class="modal-actions"><span></span><div class="right-actions">' +
          '<button class="btn-ghost" id="btnPromptCancel">Отмена</button>' +
          '<button class="btn btn-primary" id="btnPromptOk">Добавить</button>' +
        "</div></div>" +
      "</div></div>";
    var input = document.getElementById("promptInput");
    setTimeout(function () { input.focus(); }, 0);
    function submit() {
      var v = input.value.trim();
      if (!v) { input.focus(); return; }
      closeModal();
      onSubmit(v);
    }
    document.getElementById("overlayPrompt").addEventListener("mousedown", function (e) { if (e.target.id === "overlayPrompt") closeModal(); });
    document.getElementById("btnPromptCancel").addEventListener("click", closeModal);
    document.getElementById("btnPromptOk").addEventListener("click", submit);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  }

  function showNewProjectModal(onSubmit) {
    document.getElementById("modalRoot").innerHTML =
      '<div class="overlay" id="overlayNewProj"><div class="modal" style="max-width:400px;">' +
        '<h2 style="margin-bottom:14px;">Новый проект</h2>' +
        '<div class="field"><label>Название</label><input type="text" id="npName" placeholder="Например, Запуск нового ЖК"></div>' +
        '<div class="field"><label>Тема (для поиска и фильтра)</label><input type="text" id="npTopic" placeholder="Например, Девелопмент" list="npTopicList"><datalist id="npTopicList">' +
          (function () {
            var seen = [];
            state.projects.forEach(function (p) { if (p.topic && seen.indexOf(p.topic) === -1) seen.push(p.topic); });
            return seen.map(function (t) { return '<option value="' + escapeHtml(t) + '">'; }).join("");
          })() +
        '</datalist></div>' +
        '<div class="modal-actions"><span></span><div class="right-actions">' +
          '<button class="btn-ghost" id="npCancel">Отмена</button>' +
          '<button class="btn btn-primary" id="npOk">Создать</button>' +
        '</div></div>' +
      '</div></div>';
    var nameInput = document.getElementById("npName");
    setTimeout(function () { nameInput.focus(); }, 0);
    function submit() {
      var name = nameInput.value.trim();
      if (!name) { nameInput.focus(); return; }
      var topic = document.getElementById("npTopic").value.trim();
      closeModal();
      onSubmit(name, topic);
    }
    document.getElementById("overlayNewProj").addEventListener("mousedown", function (e) { if (e.target.id === "overlayNewProj") closeModal(); });
    document.getElementById("npCancel").addEventListener("click", closeModal);
    document.getElementById("npOk").addEventListener("click", submit);
    nameInput.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  }

  // ---------- library & navigation ----------
  function renderCurrentView() {
    document.getElementById("viewLibrary").classList.toggle("hidden", state.view !== "library");
    document.getElementById("viewProject").classList.toggle("hidden", state.view !== "project");
    if (state.view === "library") renderLibrary(); else renderAll();
  }

  function renderLibTopicOptions() {
    var sel = document.getElementById("libTopic");
    var cur = sel.value || state.libTopic || "all";
    var topics = [];
    state.projects.forEach(function (p) { var t = p.topic || "Без темы"; if (topics.indexOf(t) === -1) topics.push(t); });
    topics.sort();
    sel.innerHTML = '<option value="all">Все темы</option>' + topics.map(function (t) {
      return '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + "</option>";
    }).join("");
    sel.value = (cur === "all" || topics.indexOf(cur) !== -1) ? cur : "all";
    state.libTopic = sel.value;
  }

  function renderLibrary() {
    renderLibTopicOptions();
    var q = state.libSearch.trim().toLowerCase();
    var list = state.projects.filter(function (p) {
      var topic = p.topic || "Без темы";
      if (state.libTopic !== "all" && topic !== state.libTopic) return false;
      if (q) {
        var hay = ((p.name || "") + " " + (p.description || "") + " " + (p.topic || "")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    }).sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });

    var grid = document.getElementById("libGrid");
    document.getElementById("libEmpty").textContent = state.catalogLoaded ? "Ничего не нашлось — попробуйте другой запрос или тему." : "Загружаем библиотеку…";
    document.getElementById("libEmpty").style.display = list.length ? "none" : "block";
    grid.innerHTML = list.map(function (p) {
      var pct = Math.max(0, Math.min(100, p.avgProgress || 0));
      var dur = p.maxEnd || 0;
      return '<button class="libCard" data-id="' + p.id + '">' +
        (p.topic ? '<span class="libCard-topic">' + escapeHtml(p.topic) + "</span>" : "") +
        "<h2>" + escapeHtml(p.name || "Без названия") + "</h2>" +
        "<p>" + escapeHtml(p.description || "") + "</p>" +
        '<div class="libCard-bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="libCard-foot"><span>' + (p.taskCount || 0) + " задач · " + pct + "%</span><span>" + (dur ? dur + " дн" : "") + "</span></div>" +
        "</button>";
    }).join("");
    Array.prototype.forEach.call(grid.querySelectorAll(".libCard"), function (btn) {
      btn.addEventListener("click", function () { openProject(btn.getAttribute("data-id")); });
    });
  }

  function openProject(id) {
    state.projectId = id;
    state._projectLoaded = false;
    state._sharedFp = null;
    state.groups = []; state.team = []; state.tasks = []; state.holidays = [];
    state.view = "project";
    location.hash = "p=" + id;
    state.search = ""; state.assigneeFilter = "all"; state.hideDone = false; state.editingTask = null;
    lastProjectRaw = null;
    renderCurrentView();
    loadProject(true);
    startProjectPolling();
  }

  function backToLibrary() {
    stopProjectPolling();
    state.view = "library";
    state.projectId = null;
    location.hash = "";
    renderCurrentView();
    loadCatalog(false);
  }

  function createProject(name, topic) {
    var id = uid();
    var entry = { id: id, name: name, description: "", topic: topic || "", color: SWATCHES[state.projects.length % SWATCHES.length], createdAt: Date.now(), taskCount: 0, avgProgress: 0, maxEnd: 0 };
    state.projects.push(entry);
    remoteWrite("index", { upsert: entry }).catch(function (e) { writeFail(e, "Не удалось создать проект."); });
    openProject(id);
  }

  function setIfNotEditing(id, value) {
    var el = document.getElementById(id);
    if (!el || document.activeElement === el) return;
    if (el.value !== value) el.value = value;
  }

  function saveProjectMeta() {
    if (!state.projectId) return;
    var patch = {
      id: state.projectId,
      name: document.getElementById("projectTitle").value.trim() || "Без названия",
      description: document.getElementById("projectDesc").value.trim(),
      topic: document.getElementById("projectTopic").value.trim()
    };
    var cur = state.projects.find(function (p) { return p.id === state.projectId; });
    if (cur) Object.assign(cur, patch); else state.projects.push(Object.assign({ color: SWATCHES[0], createdAt: Date.now() }, patch));
    remoteWrite("index", { upsert: patch }).catch(function (e) { writeFail(e, "Не удалось сохранить изменения проекта."); });
  }
  ["projectTitle", "projectDesc", "projectTopic"].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener("change", saveProjectMeta);
    el.addEventListener("keydown", function (e) { if (e.key === "Enter") el.blur(); });
  });

  document.getElementById("btnNewProject").addEventListener("click", function () {
    showNewProjectModal(function (name, topic) { createProject(name, topic); });
  });
  document.getElementById("btnBackToLibrary").addEventListener("click", backToLibrary);
  document.getElementById("libSearch").addEventListener("input", function (e) { state.libSearch = e.target.value; renderLibrary(); });
  document.getElementById("libTopic").addEventListener("change", function (e) { state.libTopic = e.target.value; renderLibrary(); });

// ---------- storage: bucket through the cloud function ----------
  var FUNCTION_URL = "https://functions.yandexcloud.net/d4ega35alhn28oab98di";
  var PW_KEY = "gantt_team_password_v1";
  var POLL_CATALOG_MS = 20000, POLL_PROJECT_MS = 8000;
  var pending = 0, writeEpoch = 0, lastCatalogRaw = null, lastProjectRaw = null;
  var catalogTimer = null, projectTimer = null, statsTimer = null, pwPromise = null;

  function getPassword() { try { return localStorage.getItem(PW_KEY) || ""; } catch (e) { return ""; } }
  function setPassword(v) { try { localStorage.setItem(PW_KEY, v); } catch (e) {} }
  function clearPassword() { try { localStorage.removeItem(PW_KEY); } catch (e) {} }

  // one request to ?data=<name>; GET returns {data, raw}, errors carry .code = "auth" | "net"
  function api(name, method, body) {
    var opts = { method: method, headers: { "X-Edit-Key": getPassword() }, cache: "no-store" };
    if (body != null) { opts.body = JSON.stringify(body); opts.headers["Content-Type"] = "application/json"; }
    return fetch(FUNCTION_URL + "?data=" + encodeURIComponent(name), opts).then(function (r) {
      return r.text().then(function (txt) {
        var data = null; try { data = JSON.parse(txt); } catch (e) {}
        if (r.status === 403) { var ea = new Error("auth"); ea.code = "auth"; throw ea; }
        if (!r.ok) { var eh = new Error("Сервер вернул ошибку " + r.status + (data && data.error ? ": " + data.error : ".")); eh.code = "http"; throw eh; }
        return { data: data, raw: txt };
      });
    }, function () {
      var en = new Error("Нет связи с сервером. Проверьте интернет и обновите страницу."); en.code = "net"; throw en;
    });
  }
  // same, but asks for the team password when it is missing or wrong, then retries
  function apiAuth(name, method, body) {
    if (!getPassword()) return askPassword("").then(function () { return apiAuth(name, method, body); });
    return api(name, method, body).catch(function (e) {
      if (e && e.code === "auth") {
        clearPassword();
        return askPassword("Неверный пароль. Попробуйте ещё раз.").then(function () { return apiAuth(name, method, body); });
      }
      throw e;
    });
  }
  function askPassword(errText) {
    if (pwPromise) return pwPromise;
    pwPromise = new Promise(function (resolve) {
      var root = document.getElementById("authRoot");
      root.innerHTML =
        '<div class="overlay" style="z-index:900;background:rgba(10,14,18,.7);"><form class="modal" id="authForm" style="max-width:360px;">' +
          '<h2 style="margin-bottom:6px;">Дорожные карты</h2>' +
          '<p style="margin:0 0 14px;font-size:13px;color:var(--ink-soft);line-height:1.5;">Введите пароль отдела маркетинга. Он запоминается в этом браузере.</p>' +
          '<div class="field"><label for="authPw">Пароль</label><input type="password" id="authPw" autocomplete="current-password" style="width:100%;background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;padding:9px 10px;font-size:14px;color:var(--ink);"></div>' +
          '<p class="shareErr" id="authErr" style="' + (errText ? "" : "display:none;") + '">' + escapeHtml(errText || "") + '</p>' +
          '<div class="modal-actions"><span></span><div class="right-actions"><button class="btn btn-primary" type="submit">Войти</button></div></div>' +
        "</form></div>";
      var pw = document.getElementById("authPw");
      setTimeout(function () { pw.focus(); }, 0);
      document.getElementById("authForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var v = pw.value.trim();
        if (!v) { pw.focus(); return; }
        setPassword(v);
        root.innerHTML = "";
        pwPromise = null;
        resolve();
      });
    });
    return pwPromise;
  }

  function writeFail(err, fallback) {
    showToast((err && err.code === "net" ? err.message : (err && err.message) || fallback) || fallback, 6000);
  }
  // a write that blocks background refreshes while it is in flight
  function remoteWrite(name, patch) {
    pending++; writeEpoch++;
    return apiAuth(name, "POST", patch).then(function (res) {
      pending--; writeEpoch++; lastProjectRaw = null; lastCatalogRaw = null; return res;
    }, function (e) { pending--; writeEpoch++; throw e; });
  }
  function isInteracting() {
    var c = document.body.classList;
    return c.contains("dragging-bar") || c.contains("linking-deps") || c.contains("resizing-cols");
  }

  function initStorage() {
    loadCatalog(true).then(function () { if (state.projectId) { loadProject(true); startProjectPolling(); } });
    clearInterval(catalogTimer);
    catalogTimer = setInterval(function () { if (!document.hidden) loadCatalog(false); }, POLL_CATALOG_MS);
  }

  // ----- library (catalog of all roadmaps) -----
  function loadCatalog(initial) {
    var epoch = writeEpoch;
    return apiAuth("index", "GET").then(function (res) {
      state.catalogLoaded = true;
      hideBanner();
      if (epoch !== writeEpoch || pending > 0) return;
      if (res.raw === lastCatalogRaw && !initial) return;
      lastCatalogRaw = res.raw;
      state.projects = (res.data && res.data.projects) || [];
      renderCurrentView();
    }).catch(function (e) { if (initial) { state.catalogLoaded = true; showBanner((e && e.message) || "Не удалось загрузить библиотеку."); renderCurrentView(); } });
  }

  // ----- one project -----
  function startProjectPolling() {
    clearInterval(projectTimer);
    projectTimer = setInterval(function () { if (!document.hidden && state.projectId) loadProject(false); }, POLL_PROJECT_MS);
  }
  function stopProjectPolling() { clearInterval(projectTimer); projectTimer = null; }

  function loadProject(initial) {
    var id = state.projectId;
    if (!id) return Promise.resolve();
    var epoch = writeEpoch;
    return apiAuth("p-" + id, "GET").then(function (res) {
      if (id !== state.projectId) return;
      if (epoch !== writeEpoch || pending > 0 || isInteracting()) return;
      if (res.raw === lastProjectRaw && !initial) return;
      lastProjectRaw = res.raw;
      var d = res.data || {};
      var fresh = !Array.isArray(d.groups) || d.groups.length === 0;
      state.groups = fresh ? defaultGroups() : cloneList(d.groups);
      state.team = cloneList(d.team);
      state.tasks = cloneList(d.tasks);
      state.holidays = (d.holidays || []).slice();
      state._projectLoaded = true;
      hideBanner();
      if (fresh) writeBoard(); else renderAll();
    }).catch(function (e) { if (initial) showBanner((e && e.message) || "Не удалось загрузить карту."); });
  }

  function cloneList(arr) { return (arr || []).map(function (x) { return Object.assign({}, x); }); }

  // keep the library card (task count / progress / duration) in step with the project
  function scheduleStats() {
    clearTimeout(statsTimer);
    statsTimer = setTimeout(function () {
      if (!state.projectId) return;
      var patch = Object.assign({ id: state.projectId }, computeProjectStats());
      var cur = state.projects.find(function (p) { return p.id === state.projectId; });
      if (cur) Object.assign(cur, patch);
      remoteWrite("index", { upsert: patch }).catch(function () {});
    }, 1500);
  }

  function writeBoard() {
    var pid = state.projectId;
    renderAll();
    remoteWrite("p-" + pid, { board: { groups: state.groups, team: state.team, holidays: state.holidays } })
      .catch(function (e) { writeFail(e, "Не удалось сохранить изменения."); });
  }

  // task writes are collected for a moment and sent as one request
  var taskQueue = {}, taskQueueCount = 0, taskFlushTimer = null, taskQueuePid = null;
  function writeTask(task) {
    var body = {
      id: task.id, title: task.title, groupId: task.groupId, assigneeIds: assigneeIdsOf(task),
      start: task.start, end: task.end, progress: task.progress || 0, milestone: !!task.milestone,
      color: task.color, dependencies: Array.isArray(task.dependencies) ? task.dependencies : [],
      createdAt: task.createdAt, updatedAt: Date.now()
    };
    var idx = state.tasks.findIndex(function (t) { return t.id === task.id; });
    if (idx >= 0) state.tasks[idx] = task; else state.tasks.push(task);
    if (taskQueueCount === 0) { pending++; writeEpoch++; taskQueuePid = state.projectId; }
    if (!taskQueue[task.id]) taskQueueCount++;
    taskQueue[task.id] = body;
    clearTimeout(taskFlushTimer);
    taskFlushTimer = setTimeout(flushTasks, 40);
    renderAll();
  }
  function flushTasks() {
    var items = Object.keys(taskQueue).map(function (k) { return taskQueue[k]; });
    var pid = taskQueuePid;
    taskQueue = {}; taskQueueCount = 0;
    if (!items.length) return;
    apiAuth("p-" + pid, "POST", { tasks: { upsert: items } }).then(function () {
      pending--; writeEpoch++; lastProjectRaw = null; scheduleStats();
    }, function (e) { pending--; writeEpoch++; writeFail(e, "Не удалось сохранить задачу."); });
  }
  function deleteTask(id) {
    var pid = state.projectId;
    state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
    state.tasks.forEach(function (t) { if (Array.isArray(t.dependencies)) t.dependencies = t.dependencies.filter(function (d) { return d !== id; }); });
    renderAll();
    remoteWrite("p-" + pid, { tasks: { delete: [id] } }).then(scheduleStats)
      .catch(function (e) { writeFail(e, "Не удалось удалить задачу."); });
  }

  function deleteProject(id) {
    var meta = state.projects.find(function (p) { return p.id === id; });
    var tok = meta && meta.shareToken;
    var steps = Promise.resolve();
    if (tok) steps = steps.then(function () { return shareRequest("DELETE", tok, null); }).catch(function () {});
    steps.then(function () { return remoteWrite("p-" + id, { deleteProject: true }); })
      .then(function () { return remoteWrite("index", { delete: id }); })
      .then(function () {
        state.projects = state.projects.filter(function (p) { return p.id !== id; });
        backToLibrary();
        showToast("Карта удалена.");
      }).catch(function (e) { writeFail(e, "Не удалось удалить карту."); });
  }

  // one-time import of roadmaps exported from the previous (claude.ai) version
  function importRoadmaps(obj) {
    var list = obj && Array.isArray(obj.projects) ? obj.projects : [];
    if (!list.length) { showToast("В файле нет карт для импорта."); return; }
    var chain = Promise.resolve(), n = 0;
    list.forEach(function (p) {
      if (!p || !p.id) return;
      chain = chain.then(function () {
        return remoteWrite("p-" + p.id, { replace: { groups: p.groups || [], team: p.team || [], holidays: p.holidays || [], tasks: p.tasks || [] } });
      }).then(function () {
        var meta = { id: p.id, name: p.name || "Без названия", description: p.description || "", topic: p.topic || "", color: p.color || SWATCHES[0], createdAt: p.createdAt || Date.now() };
        var t = p.tasks || [], maxEnd = 0, sum = 0;
        t.forEach(function (x) { var e = toDayNum(x.end || x.start || 1); if (e > maxEnd) maxEnd = e; sum += x.progress || 0; });
        meta.taskCount = t.length; meta.avgProgress = t.length ? Math.round(sum / t.length) : 0; meta.maxEnd = maxEnd;
        return remoteWrite("index", { upsert: meta });
      }).then(function () { n++; });
    });
    chain.then(function () { showToast("Импортировано карт: " + n + "."); return loadCatalog(true); })
      .catch(function (e) { writeFail(e, "Импорт не удался."); });
  }

  // ---------- layout computation ----------
  function computeRange() {
    var maxEnd = 14;
    state.tasks.forEach(function (t) {
      var e = toDayNum(t.end || t.start || 1);
      if (e > maxEnd) maxEnd = e;
    });
    var end = maxEnd + 6;
    return { start: 1, end: end, totalDays: end };
  }

  function visibleTasks() {
    var q = state.search.trim().toLowerCase();
    return state.tasks.filter(function (t) {
      if (q && t.title.toLowerCase().indexOf(q) === -1) return false;
      if (state.assigneeFilter !== "all" && assigneeIdsOf(t).indexOf(state.assigneeFilter) === -1) return false;
      if (state.hideDone && (t.progress || 0) >= 100) return false;
      return true;
    });
  }

  function buildRows() {
    var tasks = visibleTasks();
    var rows = [];
    var y = 0;
    state.groups.forEach(function (g) {
      rows.push({ type: "group", group: g, top: y, height: GH });
      y += GH;
      var gt = tasks.filter(function (t) { return t.groupId === g.id; })
        .sort(function (a, b) { return toDayNum(a.start) - toDayNum(b.start); });
      gt.forEach(function (t) {
        rows.push({ type: "task", task: t, top: y, height: RH });
        y += RH;
      });
    });
    return { rows: rows, totalHeight: y };
  }

  function teamById(id) { return state.team.find(function (m) { return m.id === id; }); }
  function groupById(id) { return state.groups.find(function (g) { return g.id === id; }); }
  function taskById(id) { return state.tasks.find(function (t) { return t.id === id; }); }
  function depIdsOf(t) { return Array.isArray(t.dependencies) ? t.dependencies.filter(Boolean) : []; }
  // does a path of dependencies lead from fromId to toId in the CURRENT stored graph?
  function hasPathTo(fromId, toId, visited) {
    if (fromId === toId) return true;
    visited = visited || {};
    if (visited[fromId]) return false;
    visited[fromId] = true;
    var t = taskById(fromId);
    if (!t) return false;
    var deps = depIdsOf(t);
    for (var i = 0; i < deps.length; i++) { if (hasPathTo(deps[i], toId, visited)) return true; }
    return false;
  }
  // earliest day a task is allowed to start, given the finish dates of its predecessors (Finish-to-Start)
  function taskMinAllowedStart(t) {
    var deps = depIdsOf(t).map(taskById).filter(Boolean);
    if (!deps.length) return 1;
    var maxEnd = 0;
    deps.forEach(function (d) { var e = toDayNum(d.end || d.start); if (e > maxEnd) maxEnd = e; });
    return maxEnd + 1;
  }
  // full-graph relaxation: push any task whose start now violates a predecessor's finish date forward,
  // preserving its own duration, and keep propagating until the whole graph is consistent again.
  // Bounded by task count since the dependency graph is guaranteed acyclic.
  function cascadeReschedule() {
    var changedIds = [];
    var maxPasses = state.tasks.length + 5;
    for (var pass = 0; pass < maxPasses; pass++) {
      var anyChange = false;
      state.tasks.forEach(function (t) {
        if (depIdsOf(t).length === 0) return;
        var minStart = taskMinAllowedStart(t);
        var curStart = toDayNum(t.start);
        if (curStart !== minStart) {
          var dur = toDayNum(t.end || t.start) - curStart;
          t.start = minStart;
          t.end = t.milestone ? minStart : minStart + dur;
          if (changedIds.indexOf(t.id) === -1) changedIds.push(t.id);
          anyChange = true;
        }
      });
      if (!anyChange) break;
    }
    return changedIds;
  }
  // apply a task's own edit, then let dependent tasks cascade forward if needed, persisting everything
  function commitTaskChange(task) {
    if (depIdsOf(task).length > 0) {
      var minStart = taskMinAllowedStart(task);
      var curStart = toDayNum(task.start);
      if (curStart !== minStart) {
        var dur = toDayNum(task.end || task.start) - curStart;
        task.start = minStart;
        task.end = task.milestone ? minStart : minStart + dur;
      }
    }
    // keep state.tasks in sync immediately (writeTask's cloud path only updates it asynchronously
    // once the snapshot echoes back, but cascadeReschedule below needs the fresh values right now)
    var idx = state.tasks.findIndex(function (x) { return x.id === task.id; });
    if (idx >= 0) state.tasks[idx] = task; else state.tasks.push(task);
    writeTask(task);
    var changed = cascadeReschedule();
    changed.forEach(function (id) {
      if (id === task.id) return;
      var t = taskById(id);
      if (t) writeTask(t);
    });
    renderAll();
  }
  function assigneeIdsOf(t) {
    if (Array.isArray(t.assigneeIds)) return t.assigneeIds.filter(Boolean);
    if (t.assigneeId) return [t.assigneeId];
    return [];
  }
  function whoHtmlFor(t) {
    var members = assigneeIdsOf(t).map(teamById).filter(Boolean);
    if (!members.length) return '<span class="avatar" style="background:var(--ink-faint)">?</span><span class="who-name">—</span>';
    var avatars = members.slice(0, 3).map(function (m, i) {
      return '<span class="avatar" style="background:' + m.color + ';margin-left:' + (i > 0 ? "-7px" : "0") + ";z-index:" + (5 - i) + ';border:2px solid var(--panel);">' + initials(m.name) + "</span>";
    }).join("");
    var extra = members.length > 3 ? '<span class="avatar" style="background:var(--ink-faint);margin-left:-7px;border:2px solid var(--panel);">+' + (members.length - 3) + "</span>" : "";
    var namesText = members.map(function (m) { return m.name; }).join(", ");
    return avatars + extra + '<span class="who-name">' + escapeHtml(namesText) + "</span>";
  }

  // ---------- rendering: header / stats / filters ----------
  function renderStatInline() {
    var total = state.tasks.length;
    var maxEnd = 0;
    state.tasks.forEach(function (t) { var e = toDayNum(t.end || t.start || 1); if (e > maxEnd) maxEnd = e; });
    var avg = total ? Math.round(state.tasks.reduce(function (s, t) { return s + (t.progress || 0); }, 0) / total) : 0;
    document.getElementById("statInline").innerHTML =
      "<span>Задач: <b>" + total + "</b></span><span>Длительность: <b>" + maxEnd + " дн</b></span><span>Прогресс: <b>" + avg + "%</b></span>";
  }

  function renderAssigneeFilterOptions() {
    var sel = document.getElementById("fAssignee");
    var current = sel.value || "all";
    sel.innerHTML = '<option value="all">Все исполнители</option>' + state.team.map(function (m) {
      return '<option value="' + m.id + '">' + escapeHtml(m.name) + "</option>";
    }).join("");
    sel.value = state.team.some(function (m) { return m.id === current; }) ? current : "all";
    state.assigneeFilter = sel.value;
  }

  // ---------- main render ----------
  function renderAll() {
    var proj = state.projects.find(function (p) { return p.id === state.projectId; });
    setIfNotEditing("projectTitle", proj ? (proj.name || "") : "");
    setIfNotEditing("projectDesc", proj ? (proj.description || "") : "");
    setIfNotEditing("projectTopic", proj ? (proj.topic || "") : "");
    renderStatInline();
    renderAssigneeFilterOptions();
    var layout = buildRows();
    var dayWidth = ZOOM_WIDTH[state.zoom];
    var range = computeRange();
    state._dayWidth = dayWidth;
    state._rangeStart = range.start;
    var timelineWidth = range.totalDays * dayWidth;
    renderHeader("timelineHeadInner", range, dayWidth, timelineWidth, layout.totalHeight);
    document.getElementById("timelineBodyInner").style.width = timelineWidth + "px";
    document.getElementById("timelineBodyInner").style.height = layout.totalHeight + "px";
    renderGrid("gridLayer", range, dayWidth, timelineWidth, layout.totalHeight);
    renderSidebarRows("sidebarRows", layout, false);
    renderTimelineRows("rowsLayer", layout, range, dayWidth, false);
    renderDeps("depsLayer", layout, range, dayWidth, timelineWidth, true);
    maybeSyncShare();
  }

  function renderHeader(containerId, range, dayWidth, timelineWidth, bodyHeight) {
    var el = document.getElementById(containerId);
    el.style.width = timelineWidth + "px";
    var html = "";
    // week-of-project bands (every 7 project days) — not tied to a real calendar
    var x = 0, dayIdx = 0, weekNum = 1;
    while (dayIdx < range.totalDays) {
      var span = Math.min(7, range.totalDays - dayIdx);
      var w = span * dayWidth;
      html += '<div class="monthBand" style="left:' + x + 'px;width:' + w + 'px;">Неделя ' + weekNum + "</div>";
      x += w; dayIdx += span; weekNum++;
    }
    // day cells — plain project day numbers; non-working days (virtual weekend/holiday) are tinted
    for (var i = 0; i < range.totalDays; i++) {
      var dayNum = range.start + i;
      var left = i * dayWidth;
      var cls = "dayCell" + (!isWorkingDay(dayNum) ? " weekend" : "");
      html += '<div class="' + cls + '" style="left:' + left + 'px;width:' + dayWidth + 'px;">' + (dayWidth >= 15 ? dayNum : "") + "</div>";
    }
    el.innerHTML = html;
  }

  function renderGrid(containerId, range, dayWidth, timelineWidth, bodyHeight) {
    var el = document.getElementById(containerId);
    el.style.width = timelineWidth + "px";
    el.style.height = bodyHeight + "px";
    var html = "";
    for (var i = 0; i < range.totalDays; i++) {
      var dayNum = range.start + i;
      if (!isWorkingDay(dayNum)) {
        html += '<div class="weekendRect' + (isHolidayDay(dayNum) ? " holiday" : "") + '" style="left:' + (i * dayWidth) + 'px;width:' + dayWidth + 'px;height:' + bodyHeight + 'px;"></div>';
      }
    }
    for (var j = 0; j < range.totalDays; j += 7) {
      html += '<div class="monthLine" style="left:' + (j * dayWidth) + 'px;height:' + bodyHeight + 'px;"></div>';
    }
    el.innerHTML = html;
  }

  function renderSidebarRows(containerId, layout, printMode) {
    var el = document.getElementById(containerId);
    el.style.height = layout.totalHeight + "px";
    var html = layout.rows.map(function (row) {
      if (row.type === "group") {
        var g = row.group;
        var idx = state.groups.findIndex(function (x) { return x.id === g.id; });
        var gts = state.tasks.filter(function (t) { return t.groupId === g.id; });
        var count = "";
        if (gts.length) {
          var gs = Math.min.apply(null, gts.map(function (t) { return toDayNum(t.start); }));
          var ge = Math.max.apply(null, gts.map(function (t) { return toDayNum(t.end || t.start); }));
          count = workingDaysBetween(gs, ge);
        }
        var actions = printMode ? "" :
          '<div class="groupActions">' +
          (idx > 0 ? '<button class="iconBtn" data-gmove="-1" data-gid="' + g.id + '" title="Выше">↑</button>' : "") +
          (idx < state.groups.length - 1 ? '<button class="iconBtn" data-gmove="1" data-gid="' + g.id + '" title="Ниже">↓</button>' : "") +
          '<button class="iconBtn" data-gdel="' + g.id + '" title="Удалить этап">✕</button>' +
          "</div>";
        return '<div class="groupSideRow" style="top:' + row.top + 'px;height:' + row.height + 'px;">' +
          '<span class="groupDot" style="background:' + g.color + '"></span>' +
          (printMode
            ? '<span style="flex:1;font-size:12.5px;font-weight:600;">' + escapeHtml(g.label) + "</span>"
            : '<input class="gTitle" data-gid="' + g.id + '" value="' + escapeHtml(g.label) + '">') +
          '<span class="gCount" title="Длительность этапа, раб. дн.">' + count + "</span>" + actions +
          "</div>";
      } else {
        var t = row.task;
        var start = toDayNum(t.start), end = toDayNum(t.end || t.start);
        var workDur = workingDaysBetween(start, end);
        var whoHtml = whoHtmlFor(t);
        return '<div class="sideRow" style="top:' + row.top + 'px;height:' + row.height + 'px;"' + (printMode ? "" : ' data-open="' + t.id + '"') + '>' +
          '<div class="col-title" title="' + escapeHtml(t.title) + '">' +
            '<span class="t-title">' + escapeHtml(t.title) + "</span>" +
            '<span class="t-progress"><i style="width:' + (t.progress || 0) + "%;background:" + (t.color || "var(--accent)") + '"></i></span>' +
          "</div>" +
          '<div class="col-who who-chip">' + whoHtml + "</div>" +
          '<div class="col-days t-days">' + (t.milestone ? "веха" : workDur) + "</div>" +
          "</div>";
      }
    }).join("");
    el.innerHTML = html;
    if (!printMode) wireSidebarEvents();
  }

  function renderTimelineRows(containerId, layout, range, dayWidth, printMode) {
    var el = document.getElementById(containerId);
    el.style.height = layout.totalHeight + "px";
    var html = layout.rows.map(function (row) {
      if (row.type === "group") {
        var band = '<div class="groupBand" style="top:' + row.top + 'px;height:' + row.height + 'px;background:' + row.group.color + '11;"></div>';
        var gts = state.tasks.filter(function (t) { return t.groupId === row.group.id; });
        if (!gts.length) return band;
        var gs = Math.min.apply(null, gts.map(function (t) { return toDayNum(t.start); }));
        var ge = Math.max.apply(null, gts.map(function (t) { return toDayNum(t.end || t.start); }));
        var gAvg = Math.round(gts.reduce(function (sum, t) { return sum + (t.progress || 0); }, 0) / gts.length);
        var gLeft = (gs - range.start) * dayWidth;
        var gW = Math.max((ge - gs + 1) * dayWidth - 3, 6);
        var gOut = true;
        var gLabel = escapeHtml(row.group.label) + " · " + workingDaysBetween(gs, ge) + " дн";
        var gh = 14;
        return band +
          '<div class="groupBar' + (gOut ? " outside-label" : "") + '" title="' + gLabel + '" style="left:' + gLeft + 'px;top:' + (row.top + (row.height - gh) / 2) + 'px;width:' + gW + 'px;height:' + gh + 'px;">' +
            '<span class="gb-bg" style="background:' + row.group.color + '"></span>' +
            '<span class="gb-fill" style="width:' + gAvg + '%;background:' + row.group.color + '"></span>' +
            '<span class="gb-tick gb-l" style="border-top-color:' + row.group.color + '"></span><span class="gb-tick gb-r" style="border-top-color:' + row.group.color + '"></span>' +
            '<span class="gb-label">' + gLabel + "</span>" +
          "</div>";
      }
      var t = row.task;
      var start = toDayNum(t.start), end = toDayNum(t.end || t.start);
      var left = (start - range.start) * dayWidth;
      var color = t.color || "var(--accent)";
      if (t.milestone) {
        var cx = left;
        return '<div class="milestone"' + (printMode ? "" : ' data-open="' + t.id + '"') + ' style="left:' + cx + 'px;top:' + (row.top + row.height / 2 - 7) + 'px;background:' + color + ';"></div>' +
          '<div class="milestoneLabel" style="left:' + (cx + 14) + 'px;top:' + (row.top + row.height / 2 - 8) + 'px;">' + escapeHtml(t.title) + "</div>";
      }
      var w = Math.max((end - start + 1) * dayWidth - 3, 6);
      var outside = w < 46;
      var pct = Math.max(0, Math.min(100, t.progress || 0));
      var handles = printMode ? "" : '<span class="barHandle bh-l" title="Потяните — изменить начало"></span><span class="barHandle bh-r" title="Потяните — изменить конец"></span><span class="linkHandle" title="Потяните — создать связь ФС (Финиш-Старт) с другой задачей"></span>';
      return '<div class="bar' + (outside ? " outside-label" : "") + '"' + (printMode ? "" : ' data-open="' + t.id + '"') + ' style="left:' + left + 'px;top:' + (row.top + 7) + "px;width:" + w + "px;height:" + (row.height - 14) + 'px;">' +
        '<span class="fill-bg" style="background:' + color + '"></span>' +
        '<span class="fill-progress" style="width:' + pct + "%;background:" + color + '"></span>' +
        (outside ? '<span class="bar-label">' + escapeHtml(t.title) + "</span>" : '<span class="bar-label">' + escapeHtml(t.title) + "</span>") +
        handles +
        "</div>";
    }).join("");
    el.innerHTML = html;
  }

  function elbowPathD(x1, y1, x2, y2) {
    var stub = 10;
    if (x2 >= x1 + stub * 2) {
      var midX = x1 + stub;
      return "M " + x1 + " " + y1 + " H " + midX + " V " + y2 + " H " + (x2 - 1);
    }
    var out = x1 + stub, into = x2 - stub;
    var midY = y1 <= y2 ? y1 + (y2 - y1) / 2 : y1 - (y1 - y2) / 2;
    return "M " + x1 + " " + y1 + " H " + out + " V " + midY + " H " + into + " V " + y2 + " H " + (x2 - 1);
  }

  function renderDeps(containerId, layout, range, dayWidth, timelineWidth, interactive) {
    var svg = document.getElementById(containerId);
    svg.setAttribute("width", timelineWidth);
    svg.setAttribute("height", layout.totalHeight);
    var rowInfo = {};
    layout.rows.forEach(function (row) {
      if (row.type === "task") rowInfo[row.task.id] = row;
    });
    var paths = "";
    layout.rows.forEach(function (row) {
      if (row.type !== "task") return;
      var t = row.task;
      var deps = depIdsOf(t);
      deps.forEach(function (depId) {
        var predRow = rowInfo[depId];
        if (!predRow) return;
        var pred = predRow.task;
        var predEnd = toDayNum(pred.end || pred.start);
        var succStart = toDayNum(t.start);
        var x1 = (predEnd - range.start + 1) * dayWidth;
        var y1 = predRow.top + predRow.height / 2;
        var x2 = (succStart - range.start) * dayWidth;
        var y2 = row.top + row.height / 2;
        var violated = succStart <= predEnd;
        var d = elbowPathD(x1, y1, x2, y2);
        if (interactive) {
          var predTitle = pred ? pred.title : "";
          paths += '<path class="depHit" d="' + d + '" data-pred="' + depId + '" data-succ="' + t.id + '"><title>ФС (Финиш-Старт) · клик — удалить связь: ' + escapeHtml(predTitle) + " → " + escapeHtml(t.title) + "</title></path>";
        }
        paths += '<path class="depPath' + (violated ? " warn" : "") + '" d="' + d + '" marker-end="url(#' + (violated ? "arrowWarn" : "arrowNormal") + ')"></path>';
      });
    });
    var defs = svg.querySelector("defs");
    svg.innerHTML = "";
    if (defs) svg.appendChild(defs);

  var _rafPending = false;
  function scheduleRender() {
    if (_rafPending) return;
    _rafPending = true;
    requestAnimationFrame(function () { _rafPending = false; renderAll(); });
  }

  function startBarDrag(e, taskId, mode) {
    if (e.button !== undefined && e.button !== 0) return;
    var task = state.tasks.find(function (x) { return x.id === taskId; });
    if (!task) return;
    if ((mode === "start" || mode === "move") && depIdsOf(task).length > 0) {
      showToast("Начало этой задачи задаётся предшественником (ФС) — сдвиньте его, чтобы изменить срок.");
      return;
    }
    e.preventDefault();
    var dayWidth = state._dayWidth || ZOOM_WIDTH[state.zoom];
    var origStart = toDayNum(task.start), origEnd = toDayNum(task.end || task.start);
    var startX = e.clientX;
    var moved = false;

    function apply(clientX) {
      var dx = clientX - startX;
      if (Math.abs(dx) > 3) moved = true;
      var delta = Math.round(dx / dayWidth);
      var ns = origStart, ne = origEnd;
      if (mode === "start") {
        ns = Math.max(1, Math.min(origEnd, origStart + delta));
      } else if (mode === "end") {
        ne = Math.max(origStart, origEnd + delta);
      } else {
        ns = Math.max(1, origStart + delta);
        ne = ns + (origEnd - origStart);
      }
      task.start = ns;
      task.end = task.milestone ? ns : ne;
      scheduleRender();
    }
    function onMove(ev) { apply(ev.clientX); }
    function onUp() {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      document.body.classList.remove("dragging-bar");
      if (moved) { suppressNextBarClick = true; commitTaskChange(task); }
    }
    document.body.classList.add("dragging-bar");
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  }

  document.getElementById("rowsLayer").addEventListener("mousedown", function (e) {
    var linkHandle = e.target.closest(".linkHandle");
    if (linkHandle) {
      var srcBar = linkHandle.closest(".bar[data-open]");
      if (srcBar) startLinkDrag(e, srcBar.getAttribute("data-open"));
      return;
    }
    var handle = e.target.closest(".barHandle");
    if (handle) {
      var bar = handle.closest(".bar");
      if (bar) startBarDrag(e, bar.getAttribute("data-open"), handle.classList.contains("bh-l") ? "start" : "end");
      return;
    }
    var moveEl = e.target.closest(".bar[data-open], .milestone[data-open]");
    if (moveEl) startBarDrag(e, moveEl.getAttribute("data-open"), "move");
  });

  function startLinkDrag(e, sourceTaskId) {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    var svg = document.getElementById("depsLayer");
    var timelineInner = document.getElementById("timelineBodyInner");
    var sourceBarEl = e.target.closest(".bar[data-open]");
    if (!sourceBarEl) return;

    var ghost = document.createElementNS("http://www.w3.org/2000/svg", "path");
    ghost.setAttribute("class", "ghostLinkPath");
    svg.appendChild(ghost);

    var curTarget = null;

    function point(clientX, clientY) {
      var r = timelineInner.getBoundingClientRect();
      return { x: clientX - r.left, y: clientY - r.top };
    }
    var barRect = sourceBarEl.getBoundingClientRect();
    var start = point(barRect.right, barRect.top + barRect.height / 2);

    function onMove(ev) {
      var p = point(ev.clientX, ev.clientY);
      ghost.setAttribute("d", elbowPathD(start.x, start.y, p.x, p.y));
      var el = document.elementFromPoint(ev.clientX, ev.clientY);
      var target = el && el.closest ? el.closest(".bar[data-open], .milestone[data-open]") : null;
      if (target === sourceBarEl) target = null;
      if (target !== curTarget) {
        if (curTarget) curTarget.classList.remove("dropTargetHighlight");
        if (target) target.classList.add("dropTargetHighlight");
        curTarget = target;
      }
    }
    function onUp() {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      document.body.classList.remove("linking-deps");
      ghost.remove();
      if (curTarget) {
        curTarget.classList.remove("dropTargetHighlight");
        createDependencyLink(sourceTaskId, curTarget.getAttribute("data-open"));
      }
    }
    document.body.classList.add("linking-deps");
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  }

  function createDependencyLink(predId, succId) {
    if (!predId || !succId || predId === succId) return;
    var succ = taskById(succId);
    if (!succ) return;
    if (hasPathTo(predId, succId)) {
      showToast("Не удалось создать связь — это привело бы к циклической зависимости.");
      return;
    }
    var deps = depIdsOf(succ);
    if (deps.indexOf(predId) !== -1) return;
    succ.dependencies = deps.concat([predId]);
    commitTaskChange(succ);
  }

  function removeDependencyLink(predId, succId) {
    var succ = taskById(succId);
    if (!succ) return;
    var pred = taskById(predId);
    succ.dependencies = depIdsOf(succ).filter(function (id) { return id !== predId; });
    var idx = state.tasks.findIndex(function (x) { return x.id === succ.id; });
    if (idx >= 0) state.tasks[idx] = succ;
    writeTask(succ);
    renderAll();
    showToast("Связь удалена: «" + (pred ? pred.title : predId) + "» → «" + succ.title + "»");
  }
