    renderHolidayList();
    document.getElementById("overlayHolidays").addEventListener("mousedown", function (e) { if (e.target.id === "overlayHolidays") closeModal(); });
    document.getElementById("btnCloseHolidays").addEventListener("click", closeModal);
    document.getElementById("btnAddHoliday").addEventListener("click", function () {
      var input = document.getElementById("newHolidayDay");
      var day = toDayNum(input.value);
      if (!input.value.trim()) return;
      if (state.holidays.indexOf(day) === -1) { state.holidays.push(day); state.holidays.sort(function (a, b) { return a - b; }); writeBoard(); renderAll(); }
      input.value = "";
      renderHolidayList();
    });
  }
  function renderHolidayList() {
    var el = document.getElementById("holidayListEl");
    if (!el) return;
    if (state.holidays.length === 0) { el.innerHTML = '<p style="color:var(--ink-faint);font-size:12.5px;margin:4px 0;">Праздники не добавлены.</p>'; return; }
    el.innerHTML = state.holidays.map(function (day) {
      return '<div class="teamRow"><span style="flex:1;font-size:13px;">День ' + day + "</span><button class=\"iconBtn\" data-hdel=\"" + day + "\" title=\"Удалить\">✕</button></div>";
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll("[data-hdel]"), function (btn) {
      btn.addEventListener("click", function () {
        var day = parseInt(btn.getAttribute("data-hdel"), 10);
        state.holidays = state.holidays.filter(function (d) { return d !== day; });
        writeBoard();
        renderAll();
        renderHolidayList();
      });
    });
  }

// ---------- public share links (read-only snapshot in the bucket) ----------
  var VIEWER_URL = "https://aknetoria-afk.github.io/roadmap-view.html";
  var shareTimer = null;

  function currentProjectMeta() { return state.projects.find(function (p) { return p.id === state.projectId; }) || null; }
  function shareTokenOf() { var m = currentProjectMeta(); return m && m.shareToken ? m.shareToken : ""; }
  function shareLinkFor(token) { return VIEWER_URL + "?t=" + token; }
  function newShareToken() {
    var a = new Uint8Array(24);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.prototype.map.call(a, function (b) { return (b % 36).toString(36); }).join("");
  }
  function snapshotCore() {
    var m = currentProjectMeta() || {};
    return {
      v: 1, name: m.name || "Без названия", description: m.description || "", topic: m.topic || "",
      groups: state.groups.map(function (g) { return { id: g.id, label: g.label, color: g.color }; }),
      team: state.team.map(function (t) { return { id: t.id, name: t.name, color: t.color }; }),
      holidays: state.holidays.slice(),
      tasks: state.tasks.map(function (t) {
        return { id: t.id, title: t.title, groupId: t.groupId, assigneeIds: assigneeIdsOf(t), start: t.start, end: t.end,
                 progress: t.progress || 0, milestone: !!t.milestone, color: t.color, dependencies: depIdsOf(t) };
      })
    };
  }
  // one request to the publishing function; rejects with a human-readable reason
  function shareRequest(method, token, body) {
    var opts = { method: method, headers: { "X-Edit-Key": getPassword() } };
    if (body != null) { opts.body = body; opts.headers["Content-Type"] = "application/json"; }
    return fetch(FUNCTION_URL + "?share=" + token, opts).then(function (r) {
      return r.text().then(function (txt) {
        var data = null; try { data = JSON.parse(txt); } catch (e) {}
        if (r.status === 403) throw new Error("Сервер не принял пароль. Нажмите «Сменить пароль» в библиотеке и введите его заново.");
        if (!r.ok) throw new Error("Сервер вернул ошибку " + r.status + (data && data.error ? ": " + data.error : "."));
        if (!data || data.ok !== true) throw new Error("Сервер ответил не так, как ожидалось: проверьте, что код функции в Yandex Cloud обновлён.");
      });
    }, function () {
      throw new Error("Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.");
    });
  }
  function sharePublish(token) {
    var core = snapshotCore();
    var fp = JSON.stringify(core);
    core.updatedAt = Date.now();
    return shareRequest("POST", token, JSON.stringify(core)).then(function () { state._sharedFp = fp; });
  }
  function shareRevoke(token) { return shareRequest("DELETE", token, null); }
  function shareFail(err, fallback) {
    var msg = (err && err.message) || fallback;
    var box = document.getElementById("shErr");
    if (box) { box.textContent = msg; box.style.display = "block"; } else showToast(msg, 12000);
  }
  function setProjectShareToken(token) {
    var cur = currentProjectMeta();
    if (cur) cur.shareToken = token || "";
    return remoteWrite("index", { upsert: { id: state.projectId, shareToken: token || "" } });
  }
  // keep the public copy in step with edits made here (never before this project's data has loaded)
  function maybeSyncShare() {
    var token = shareTokenOf();
    if (!token || !state._projectLoaded) return;
    var fp = JSON.stringify(snapshotCore());
    if (state._sharedFp == null) { state._sharedFp = fp; return; }
    if (fp === state._sharedFp) return;
    clearTimeout(shareTimer);
    shareTimer = setTimeout(function () { sharePublish(token).catch(function (e) { shareFail(e, "Не удалось обновить публичную ссылку."); }); }, 2500);
  }

  function copyText(text, inputEl) {
    function legacy() {
      try { inputEl.focus(); inputEl.select(); var ok = document.execCommand("copy"); showToast(ok ? "Ссылка скопирована." : "Выделите ссылку и скопируйте вручную (Ctrl+C)."); }
      catch (e) { showToast("Выделите ссылку и скопируйте вручную (Ctrl+C)."); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { showToast("Ссылка скопирована."); }, legacy);
    else legacy();
  }

  function openShareModal() {
    if (!state.projectId) return;
    var token = shareTokenOf();
    var body;
    var errBox = '<p class="shareErr" id="shErr" style="display:none;"></p>';
    if (!token) {
      body =
        '<p class="shareNote">Создаст публичную ссылку на <b>эту</b> дорожную карту. Открывается без входа и аккаунта, в режиме «только просмотр»; другие карты из библиотеки по ней не видны. В карте видны названия задач, сроки и имена исполнителей.</p>' +
        '<div class="modal-actions"><span></span><div class="right-actions"><button class="btn-ghost" id="shClose">Отмена</button><button class="btn btn-primary" id="shCreate">Создать ссылку</button></div></div>' + errBox;
    } else {
      body =
        '<p class="shareNote">Любой, у кого есть эта ссылка, может открыть дорожную карту в режиме «только просмотр».</p>' +
        '<div class="shareBox"><input type="text" id="shLink" readonly value="' + escapeHtml(shareLinkFor(token)) + '"><button class="btn btn-primary" id="shCopy">Копировать</button></div>' +
        '<p class="shareState">Ссылка обновляется автоматически, когда карту правят здесь. Дата последнего обновления видна внизу публичной страницы.</p>' +
        '<div class="modal-actions"><button class="btn-ghost btn-danger" id="shRevoke">Отключить ссылку</button><div class="right-actions"><button class="btn-ghost" id="shRefresh">Обновить сейчас</button><button class="btn btn-primary" id="shClose">Готово</button></div></div>' + errBox;
    }
    document.getElementById("modalRoot").innerHTML =
      '<div class="overlay" id="overlayShare"><div class="modal" style="max-width:480px;"><h2>Поделиться дорожной картой</h2>' + body + "</div></div>";
    document.getElementById("overlayShare").addEventListener("mousedown", function (e) { if (e.target.id === "overlayShare") closeModal(); });
    document.getElementById("shClose").addEventListener("click", closeModal);
    var create = document.getElementById("shCreate");
    if (create) create.addEventListener("click", function () {
      create.disabled = true; create.textContent = "Создаём…";
      var t = newShareToken();
      sharePublish(t).then(function () { return setProjectShareToken(t); }).then(function () { openShareModal(); })
        .catch(function (e) { create.disabled = false; create.textContent = "Создать ссылку"; shareFail(e, "Не удалось создать ссылку."); });
    });
    var copy = document.getElementById("shCopy");
    if (copy) copy.addEventListener("click", function () { var inp = document.getElementById("shLink"); copyText(inp.value, inp); });
    var refresh = document.getElementById("shRefresh");
    if (refresh) refresh.addEventListener("click", function () {
      refresh.disabled = true;
      sharePublish(token).then(function () { refresh.disabled = false; showToast("Публичная копия обновлена."); })
        .catch(function (e) { refresh.disabled = false; shareFail(e, "Не удалось обновить публичную копию."); });
    });
    var revoke = document.getElementById("shRevoke");
    if (revoke) revoke.addEventListener("click", function () {
      showConfirm("Отключить публичную ссылку? Те, кому вы её отправили, больше не смогут открыть карту.", function () {
        shareRevoke(token).then(function () { return setProjectShareToken(""); }).then(function () { state._sharedFp = null; showToast("Ссылка отключена."); })
          .catch(function (e) { shareFail(e, "Не удалось отключить ссылку."); });
      });
    });
  }
  document.getElementById("btnShare").addEventListener("click", openShareModal);

    // ---------- PDF export ----------
  document.getElementById("btnPdf").addEventListener("click", exportPdf);

  function buildPrintNode() {
    var dayWidth = 8;
    var range = computeRange();
    var totalDays = range.totalDays;
    dayWidth = Math.max(3, Math.min(22, Math.round(1100 / totalDays)));
    var timelineWidth = totalDays * dayWidth;
    var sbw = 360;

    var wrap = document.createElement("div");
    wrap.style.cssText = "position:fixed;top:0;left:0;background:var(--panel);padding:26px;width:" + (sbw + timelineWidth + 60) + "px;font-family:'Inter',sans-serif;color:var(--ink);";
    wrap.style.zIndex = "1";

    var title = document.createElement("div");
    title.style.cssText = "font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;margin-bottom:2px;";
    title.textContent = (currentProjectMeta() && currentProjectMeta().name) || "План проекта";
    var sub = document.createElement("div");
    sub.style.cssText = "font-size:12px;color:var(--ink-soft);margin-bottom:16px;";
    var now = new Date();
    sub.textContent = "Экспорт от " + pad2(now.getDate()) + "." + pad2(now.getMonth() + 1) + "." + now.getFullYear();

    var headWrap = document.createElement("div");
    headWrap.style.cssText = "display:flex;border:1px solid var(--border);border-bottom:none;";
    var sideHead = document.createElement("div");
    sideHead.style.cssText = "flex:0 0 " + sbw + "px;width:" + sbw + "px;border-right:1px solid var(--border);display:flex;align-items:center;padding:8px 10px;font-size:11px;font-weight:600;color:var(--ink-faint);";
    sideHead.textContent = "Задача / Исполнитель / Рабочие дни";
    var tlHead = document.createElement("div");
    tlHead.style.cssText = "position:relative;height:54px;width:" + timelineWidth + "px;";
    headWrap.appendChild(sideHead); headWrap.appendChild(tlHead);

    var layout = buildRows();

    var bodyWrap = document.createElement("div");
    bodyWrap.style.cssText = "display:flex;border:1px solid var(--border);position:relative;";
    var sideBody = document.createElement("div");
    sideBody.id = "printSidebarRows";
    sideBody.style.cssText = "flex:0 0 " + sbw + "px;width:" + sbw + "px;border-right:1px solid var(--border);position:relative;height:" + layout.totalHeight + "px;";
    var tlBody = document.createElement("div");
    tlBody.style.cssText = "position:relative;width:" + timelineWidth + "px;height:" + layout.totalHeight + "px;";
    var grid = document.createElement("div");
    grid.id = "printGrid";
    grid.style.cssText = "position:absolute;top:0;left:0;width:" + timelineWidth + "px;height:" + layout.totalHeight + "px;";
    var rows = document.createElement("div");
    rows.id = "printRows";
    rows.style.cssText = "position:absolute;top:0;left:0;width:" + timelineWidth + "px;height:" + layout.totalHeight + "px;";
    var deps = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    deps.id = "printDeps";
    deps.style.cssText = "position:absolute;top:0;left:0;overflow:visible;";
    var defsClone = document.getElementById("depsLayer").querySelector("defs").cloneNode(true);
    deps.appendChild(defsClone);
    tlBody.appendChild(grid); tlBody.appendChild(rows); tlBody.appendChild(deps);
    bodyWrap.appendChild(sideBody); bodyWrap.appendChild(tlBody);

    wrap.appendChild(title); wrap.appendChild(sub); wrap.appendChild(headWrap); wrap.appendChild(bodyWrap);
    document.body.appendChild(wrap);

    tlHead.id = "printHeadInner";
    renderHeader("printHeadInner", range, dayWidth, timelineWidth, layout.totalHeight);
    renderGrid("printGrid", range, dayWidth, timelineWidth, layout.totalHeight);
    renderSidebarRows("printSidebarRows", layout, true);
    renderTimelineRows("printRows", layout, range, dayWidth, true);
    renderDeps("printDeps", layout, range, dayWidth, timelineWidth);

    return wrap;
  }

  function exportPdf() {
    var overlay = document.getElementById("printOverlay");
    var overlayText = document.getElementById("printOverlayText");
    var btn = document.getElementById("btnPdf");
    if (!window.html2canvas || !(window.jspdf && window.jspdf.jsPDF)) { showToast("Не удалось загрузить библиотеку PDF. Обновите страницу и проверьте интернет."); return; }
    btn.disabled = true;
    overlay.classList.add("show");
    overlayText.textContent = "Готовим PDF…";

    var node = buildPrintNode();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        html2canvas(node, { scale: 2, backgroundColor: "#ffffff" }).then(function (canvas) {
          document.body.removeChild(node);
          var pdf = new window.jspdf.jsPDF({ orientation: "landscape", unit: "pt", format: "a4" });
          var M = 20;
          var pageW = pdf.internal.pageSize.getWidth();
          var pageH = pdf.internal.pageSize.getHeight();
          var usableW = pageW - 2 * M, usableH = pageH - 2 * M;
          var imgW = usableW, imgH = canvas.height * imgW / canvas.width;
          var imgData = canvas.toDataURL("image/png");
          var heightLeft = imgH, position = M;
          pdf.addImage(imgData, "PNG", M, position, imgW, imgH);
          heightLeft -= usableH;
          while (heightLeft > 0) {
            position = M - (imgH - heightLeft);
            pdf.addPage();
            pdf.addImage(imgData, "PNG", M, position, imgW, imgH);
            heightLeft -= usableH;
          }
          var now = new Date();
          var meta = currentProjectMeta() || {};
          var base = (meta.name || "plan").replace(/[^A-Za-z0-9\u0400-\u04FF]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "plan";
          pdf.save(base + "-" + now.getFullYear() + pad2(now.getMonth() + 1) + pad2(now.getDate()) + ".pdf");
          finishExport("");
        }).catch(function () {
          try { document.body.removeChild(node); } catch (e) {}
          finishExport("Не удалось подготовить изображение для PDF.");
        });
      });
    });

    function finishExport(msg) {
      overlay.classList.remove("show");
      btn.disabled = false;
      if (msg) showBanner(msg);
    }
  }

  // ---------- column resizing ----------
  var COL_KEY = "gantt_col_widths_v1";
  var COL_DEFAULTS = { title: 150, who: 110, days: 80 };
  var COL_MIN = { title: 90, who: 56, days: 56 };
  var COL_MAX = { title: 460, who: 220, days: 150 };

  function applyColWidth(col, px) {
    document.body.style.setProperty("--col-" + col + "-w", px + "px");
  }
  function getColWidth(col) {
    return parseFloat(getComputedStyle(document.body).getPropertyValue("--col-" + col + "-w")) || COL_DEFAULTS[col];
  }
  function loadColumnWidths() {
    try {
      var raw = localStorage.getItem(COL_KEY);
      if (!raw) return;
      var w = JSON.parse(raw);
      Object.keys(COL_DEFAULTS).forEach(function (c) { if (w[c]) applyColWidth(c, w[c]); });
    } catch (e) {}
  }
  function saveColumnWidths() {
    try {
      var w = {};
      Object.keys(COL_DEFAULTS).forEach(function (c) { w[c] = getColWidth(c); });
      localStorage.setItem(COL_KEY, JSON.stringify(w));
    } catch (e) {}
  }
  function setupColumnResize() {
    Array.prototype.forEach.call(document.querySelectorAll(".colResizer"), function (handle) {
      var col = handle.getAttribute("data-resize");

      function startDrag(startClientX) {
        var startWidth = getColWidth(col);
        handle.classList.add("active");
        document.body.classList.add("resizing-cols");
        return function (clientX) {
          var next = Math.max(COL_MIN[col], Math.min(COL_MAX[col], startWidth + (clientX - startClientX)));
          applyColWidth(col, next);
        };
      }
      function endDrag() {
        handle.classList.remove("active");
        document.body.classList.remove("resizing-cols");
        saveColumnWidths();
      }

      handle.addEventListener("mousedown", function (e) {
        e.preventDefault();
        var onMove = startDrag(e.clientX);
        function move(ev) { onMove(ev.clientX); }
        function up() { document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up); endDrag(); }
        document.addEventListener("mousemove", move);
        document.addEventListener("mouseup", up);
      });
      handle.addEventListener("touchstart", function (e) {
        var t = e.touches[0];
        var onMove = startDrag(t.clientX);
        function move(ev) { onMove(ev.touches[0].clientX); ev.preventDefault(); }
        function end() { document.removeEventListener("touchmove", move); document.removeEventListener("touchend", end); endDrag(); }
        document.addEventListener("touchmove", move, { passive: false });
        document.addEventListener("touchend", end);
      }, { passive: true });
      handle.addEventListener("dblclick", function () {
        applyColWidth(col, COL_DEFAULTS[col]);
        saveColumnWidths();
      });
    });
  }

  document.getElementById("btnChangePw").addEventListener("click", function () {
    clearPassword();
    askPassword("").then(function () { lastCatalogRaw = null; loadCatalog(true); });
  });
  document.getElementById("btnImport").addEventListener("click", function () { document.getElementById("importFile").click(); });
  document.getElementById("importFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { try { importRoadmaps(JSON.parse(rd.result)); } catch (err) { showToast("Не удалось прочитать файл импорта."); } };
    rd.readAsText(f);
  });
  document.getElementById("btnDeleteProject").addEventListener("click", function () {
    if (!state.projectId) return;
    var meta = currentProjectMeta();
    showConfirm("Удалить дорожную карту «" + ((meta && meta.name) || "без названия") + "» вместе со всеми задачами? Публичная ссылка на неё тоже перестанет работать.", function () { deleteProject(state.projectId); });
  });

  // ---------- init ----------
  loadColumnWidths();
  setupColumnResize();
  var hashMatch = /(?:^#|&)p=([^&]+)/.exec(location.hash);
  if (hashMatch) { state.projectId = decodeURIComponent(hashMatch[1]); state.view = "project"; }
  window.addEventListener("hashchange", function () {
    var m = /(?:^#|&)p=([^&]+)/.exec(location.hash);
    if (m) { var id = decodeURIComponent(m[1]); if (id !== state.projectId) openProject(id); }
    else if (state.view === "project") backToLibrary();
  });
  renderCurrentView();
  initStorage();
})();
